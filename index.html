<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>앙스타 팬픽 번역기</title>
  <style>
    :root {
      --bg: #121316;
      --card-bg: #1e2025;
      --border: #2e323b;
      --accent: #ff477e;
      --text: #e6e6e6;
      --text-sub: #9aa0a6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; padding: 16px; padding-bottom: 80px;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
      font-size: 15px; line-height: 1.6;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.15rem; margin: 0; font-weight: 700; color: #fff; }
    .icon-btn {
      background: none; border: 1px solid var(--border); color: var(--text);
      padding: 6px 11px; border-radius: 8px; font-size: 0.82rem; cursor: pointer;
    }
    .icon-btn:active { background: var(--border); }
    .card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; gap: 8px;
    }
    .preset-bar {
      display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
    }
    .preset-bar select {
      width: 100%; max-width: 190px; padding: 5px 8px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: #fff; font-size: 0.85rem; font-weight: 600;
      outline: none;
    }
    textarea {
      width: 100%; height: 145px; background: transparent; border: none;
      color: var(--text); font-size: 0.95rem; line-height: 1.5; resize: vertical; outline: none;
    }
    .action-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      flex: 1; padding: 12px; border-radius: 8px; border: none;
      font-weight: 600; font-size: 0.95rem; cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-danger { background: #3a1f28; color: #ff7597; border: 1px solid #5c2b3a; }
    .btn:disabled { opacity: 0.5; }
    #outputArea {
      min-height: 160px; white-space: pre-wrap; word-break: break-word;
      font-size: 1rem; line-height: 1.8;
    }
    .scroll-top-btn {
      position: fixed; bottom: 20px; right: 20px;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--accent); color: #ffffff;
      border: none; font-size: 1.2rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      cursor: pointer; z-index: 90;
      transition: transform 0.2s;
    }
    .scroll-top-btn:active { transform: scale(0.92); }
    #settingsModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78);
      padding: 16px; z-index: 100; overflow-y: auto;
    }
    .modal-content {
      background: var(--card-bg); border-radius: 14px; padding: 18px; max-width: 480px; margin: 24px auto;
      border: 1px solid var(--border);
    }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.83rem; color: var(--text-sub); margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.9rem;
    }
    .preset-manage-box {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <header id="top">
    <h1>★ Ensemble Translator</h1>
    <button class="icon-btn" onclick="openSettings()">⚙ 설정 / 프리셋 관리</button>
  </header>

  <!-- 입력 카드 -->
  <div class="card">
    <div class="card-header">
      <div class="preset-bar">
        <span style="font-size: 0.8rem; color: var(--text-sub); white-space: nowrap;">커플링:</span>
        <select id="mainPresetSelect" onchange="switchPreset(this.value)"></select>
      </div>
      <button class="icon-btn" style="color: #ff8fa3; border-color: #4a2c36;" onclick="clearInput()">전체 지우기</button>
    </div>
    <textarea id="inputText" placeholder="일본어 원문 또는 Pixiv 소설 링크를 붙여넣으세요."></textarea>
    <div class="action-row">
      <button class="btn btn-secondary" onclick="fetchPixivOrPaste()">픽시브 링크 추출</button>
      <button class="btn btn-primary" id="translateBtn" onclick="requestTranslate()">번역하기</button>
    </div>
  </div>

  <!-- 결과 카드 -->
  <div class="card">
    <div class="card-header">
      <span style="font-size: 0.85rem; color: var(--text-sub);" id="statusLabel">번역 결과</span>
      <div style="display: flex; gap: 6px;">
        <button class="icon-btn" id="continueBtn" style="color: #ff70a6; border-color: #ff70a6; display: none;" onclick="requestContinue()">▶ 이어서 번역</button>
        <button class="icon-btn" onclick="copyResult()">복사</button>
      </div>
    </div>
    <div id="outputArea">번역 결과가 여기에 표시됩니다.</div>
  </div>

  <button class="scroll-top-btn" onclick="scrollToTop()" title="맨 위로">▲</button>

  <!-- 설정 & 프리셋 모달 -->
  <div id="settingsModal">
    <div class="modal-content">
      <h3 style="margin-top:0; margin-bottom: 14px;">API & 커플링 프리셋 설정</h3>
      
      <div class="preset-manage-box">
        <div class="field" style="margin-bottom: 10px;">
          <label>저장된 프리셋 불러오기</label>
          <select id="modalPresetSelect" onchange="loadPresetIntoModal(this.value)"></select>
        </div>
        <div class="field" style="margin-bottom: 10px;">
          <label>프리셋 이름 (새로 추가하거나 덮어쓸 이름)</label>
          <input type="text" id="presetNameInput" placeholder="예: 레이 × 코가">
        </div>
        <div class="field" style="margin-bottom: 10px;">
          <label>프롬프트 내용</label>
          <textarea id="systemPrompt" style="height: 175px; background: var(--card-bg);"></textarea>
        </div>
        <div class="action-row" style="margin-top: 6px;">
          <button class="btn btn-primary" style="padding: 9px; font-size: 0.85rem;" onclick="saveCurrentPreset()">현재 이름로 저장/추가</button>
          <button class="btn btn-danger" style="padding: 9px; font-size: 0.85rem; flex: 0.5;" onclick="deleteCurrentPreset()">삭제</button>
        </div>
      </div>

      <div class="field">
        <label>엔진 선택</label>
        <select id="engineSelect" onchange="onEngineChange()">
          <option value="deepseek">DeepSeek (권장 / 최대 8K 토큰)</option>
          <option value="openai">OpenAI (GPT-4o mini)</option>
          <option value="custom">직접 입력 (Custom Base URL)</option>
        </select>
      </div>
      <div class="field">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-...">
      </div>
      <div class="field">
        <label>Base URL</label>
        <input type="text" id="baseUrl" value="https://api.deepseek.com">
      </div>
      <div class="field">
        <label>Model 명</label>
        <input type="text" id="modelName" value="deepseek-chat">
      </div>

      <div class="action-row">
        <button class="btn btn-primary" onclick="saveApiSettings()">설정 닫기 및 적용</button>
        <button class="btn btn-secondary" onclick="closeSettings()">취소</button>
      </div>
    </div>
  </div>

  <script>
    // 기본 탑재 커플링 프리셋
    const BUILTIN_PRESETS = {
      "치아키 × 미도리": `# Role
일본 서브컬처 팬픽 및 R-18 문학 전문 번역가이자 윤문가.
직역투를 배제하고 단어 간 호응이 자연스러운 한국 웹소설 문체로 번역한다. (예: 덥수룩한 목소리 -> 잠긴/탁한 목소리)

# Name & Honorific Rules (앙스타 고유명사 엄수)
1. 한자 이름 직역 절대 금지: 공식 한국어 독음으로 번역할 것.
   - 守沢(모리사와), 奏汰(카나타), 忍(시노부), 斑(마다라), 敬人(케이토), 鉄虎(테토라), 真緒(마오)
2. 호칭 접미사(~선배, ~상, ~군, ~쨩) 음차 유지.

# Characters & Dynamic (유성대)
1. 모리사와 치아키: 1인칭 '오레', 2인칭 '오마에', 미도리를 '타카미네'로 호칭. 열혈 히어로 톤, 직선적 반말(! 다수). R-18에서는 저돌적이면서도 다정하게 이끄는 톤.
2. 타카미네 미도리: 1인칭 '보쿠', 치아키를 '모리사와 선배/선배'로 호칭. 우울·비관적 톤("우울해...", "죽고 싶어..."). 선배에게 툴툴거리는 존댓말(해요체).
3. 기타 유성대: 카나타('푸카푸카', 둥근 톤), 테토라('~임다', 치아키는 '대장'), 시노부('~고자루/~이오').

# Rules
- R-18 관능적 감각어, 신음, 체온 묘사는 검열 없이 한국 성인 웹소설 문체로 농밀하게 번역.
- 번역 본문 외 설명이나 사족은 일체 출력하지 않음.`,

      "린네 × 니키": `# Role
일본 서브컬처 팬픽 및 R-18 문학 전문 번역가이자 윤문가.
기계적 직역을 배제하고 단어 간 호응이 자연스러운 한국 웹소설 문체로 번역한다. (예: 덥수룩한 목소리 -> 잠긴/탁한 목소리)

# Name & Honorific Rules (앙스타 고유명사 엄수)
1. 한자 이름 직역 절대 금지: 공식 한국어 독음으로 번역할 것.
   - 燐音(린네), ニキ(니키), 琥珀(코하쿠), 一彩(히이로), 藍良(아이라), マヨイ(마요이), 巽(타츠미)
2. 호칭 접미사(~군, ~상, ~선배, ~쨩) 음차 유지.

# Characters & Dynamic (Crazy:B)
1. 아마기 린네: 1인칭 '오레', 2인칭 '오마에', 니키 호칭 '니키' 또는 '니키큥'. HiMERU는 '메루메루', 코하쿠는 '코하쿠 쨩'. 거칠고 능글맞은 반말, 호탕한 웃음소리 "갸하하". R-18에서는 집요하게 괴롭히며 반응을 즐기는 도발적 톤.
2. 시이나 니키: 1인칭 '보쿠', 린네 호칭 '린네 군'. 싹싹하면서도 투정과 불평이 섞인 친근한 해요체("~거든요", "~라니까요"). R-18에서는 당황해서 칭얼거리며 쉽게 달아오르는 호흡 묘사.

# Rules
- R-18 관능적 감각어, 신음, 체온 묘사는 검열 없이 한국 성인 웹소설 문체로 농밀하게 번역.
- 번역 본문 외 설명이나 사족은 일체 출력하지 않음.`
    };

    let presets = {};
    let activePresetName = "";

    window.onload = () => {
      // 프리셋 초기화 및 로드
      const savedPresets = localStorage.getItem('es_presets');
      if (savedPresets) {
        presets = JSON.parse(savedPresets);
      } else {
        presets = { ...BUILTIN_PRESETS };
        localStorage.setItem('es_presets', JSON.stringify(presets));
      }

      const keys = Object.keys(presets);
      activePresetName = localStorage.getItem('es_active_preset');
      if (!activePresetName || !presets[activePresetName]) {
        activePresetName = keys[0];
        localStorage.setItem('es_active_preset', activePresetName);
      }

      renderPresetDropdowns();

      // API 설정 로드
      document.getElementById('apiKey').value = localStorage.getItem('es_api_key') || '';
      document.getElementById('baseUrl').value = localStorage.getItem('es_base_url') || 'https://api.deepseek.com';
      document.getElementById('modelName').value = localStorage.getItem('es_model') || 'deepseek-chat';
      document.getElementById('engineSelect').value = localStorage.getItem('es_engine') || 'deepseek';
    };

    function renderPresetDropdowns() {
      const mainSel = document.getElementById('mainPresetSelect');
      const modalSel = document.getElementById('modalPresetSelect');
      mainSel.innerHTML = '';
      modalSel.innerHTML = '';

      Object.keys(presets).forEach(name => {
        const opt1 = new Option(name, name);
        const opt2 = new Option(name, name);
        mainSel.add(opt1);
        modalSel.add(opt2);
      });

      mainSel.value = activePresetName;
      modalSel.value = activePresetName;
      document.getElementById('presetNameInput').value = activePresetName;
      document.getElementById('systemPrompt').value = presets[activePresetName] || '';
    }

    // 메인 화면에서 커플링 즉시 전환
    function switchPreset(name) {
      activePresetName = name;
      localStorage.setItem('es_active_preset', name);
      renderPresetDropdowns();
    }

    // 설정 모달 내에서 다른 프리셋 선택 시 편집창에 불러오기
    function loadPresetIntoModal(name) {
      document.getElementById('presetNameInput').value = name;
      document.getElementById('systemPrompt').value = presets[name] || '';
    }

    // 프리셋 저장 / 새 프리셋 추가
    function saveCurrentPreset() {
      const name = document.getElementById('presetNameInput').value.trim();
      const content = document.getElementById('systemPrompt').value.trim();
      if (!name || !content) {
        alert("프리셋 이름과 프롬프트 내용을 모두 입력해주세요.");
        return;
      }
      presets[name] = content;
      activePresetName = name;
      localStorage.setItem('es_presets', JSON.stringify(presets));
      localStorage.setItem('es_active_preset', activePresetName);
      renderPresetDropdowns();
      alert(`'${name}' 프리셋이 저장되었습니다.`);
    }

    // 프리셋 삭제
    function deleteCurrentPreset() {
      const keys = Object.keys(presets);
      if (keys.length <= 1) {
        alert("최소 1개의 프리셋은 남겨두어야 합니다.");
        return;
      }
      const targetName = document.getElementById('modalPresetSelect').value;
      if (confirm(`'${targetName}' 프리셋을 삭제할까요?`)) {
        delete presets[targetName];
        activePresetName = Object.keys(presets)[0];
        localStorage.setItem('es_presets', JSON.stringify(presets));
        localStorage.setItem('es_active_preset', activePresetName);
        renderPresetDropdowns();
      }
    }

    // 입력창 전체 지우기
    function clearInput() {
      const inputEl = document.getElementById('inputText');
      inputEl.value = '';
      inputEl.focus();
      document.getElementById('continueBtn').style.display = 'none';
      document.getElementById('statusLabel').innerText = '번역 결과';
    }

    function onEngineChange() {
      const engine = document.getElementById('engineSelect').value;
      if (engine === 'deepseek') {
        document.getElementById('baseUrl').value = 'https://api.deepseek.com';
        document.getElementById('modelName').value = 'deepseek-chat';
      } else if (engine === 'openai') {
        document.getElementById('baseUrl').value = 'https://api.openai.com/v1';
        document.getElementById('modelName').value = 'gpt-4o-mini';
      }
    }

    function openSettings() {
      renderPresetDropdowns();
      document.getElementById('settingsModal').style.display = 'block';
    }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
    
    function saveApiSettings() {
      localStorage.setItem('es_api_key', document.getElementById('apiKey').value.trim());
      localStorage.setItem('es_base_url', document.getElementById('baseUrl').value.trim());
      localStorage.setItem('es_model', document.getElementById('modelName').value.trim());
      localStorage.setItem('es_engine', document.getElementById('engineSelect').value);
      closeSettings();
    }

    function copyResult() {
      const result = document.getElementById('outputArea').innerText;
      navigator.clipboard.writeText(result).then(() => alert("복사되었습니다."));
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function fetchPixivOrPaste() {
      let text = document.getElementById('inputText').value.trim();
      if (!text) {
        try {
          text = await navigator.clipboard.readText();
          document.getElementById('inputText').value = text;
        } catch(e) {}
      }

      const match = text.match(/(?:novel\/show\.php\?id=|\/novel\/)(\d+)/);
      if (!match) {
        alert("입력창에 올바른 Pixiv 소설 링크를 입력해주세요.");
        return;
      }

      const novelId = match[1];
      const statusLabel = document.getElementById('statusLabel');
      statusLabel.innerText = "픽시브 본문 다운로드 중...";

      try {
        const targetUrl = `https://www.pixiv.net/ajax/novel/${novelId}`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
        
        const res = await fetch(proxyUrl);
        const data = await res.json();

        if (data.error) {
          throw new Error("R-18 또는 비공개 작품입니다. 픽시브에서 본문을 직접 복사해 붙여넣어 주세요.");
        }

        let content = data.body?.content || "";
        content = content.replace(/\[newpage\]/g, "\n\n--- [페이지 구분] ---\n\n")
                         .replace(/\[\[rb:(.*?)>(.*?)\]\]/g, "$1($2)")
                         .replace(/\[chapter:(.*?)\]/g, "\n[챕터: $1]\n");

        document.getElementById('inputText').value = content;
        statusLabel.innerText = `본문 추출 완료 (${data.body.title || '무제'})`;
        alert("본문을 성공적으로 가져왔습니다.");
      } catch (err) {
        alert(err.message);
        statusLabel.innerText = "본문 추출 실패";
      }
    }

    async function requestTranslate() {
      let text = document.getElementById('inputText').value.trim();
      const apiKey = localStorage.getItem('es_api_key');
      const baseUrl = localStorage.getItem('es_base_url') || 'https://api.deepseek.com';
      const model = localStorage.getItem('es_model') || 'deepseek-chat';
      const prompt = presets[activePresetName] || Object.values(presets)[0];

      if (!apiKey) {
        alert("우측 상단 ⚙ 설정에서 API Key를 먼저 입력해주세요.");
        openSettings();
        return;
      }
      if (!text) {
        alert("번역할 텍스트를 입력해주세요.");
        return;
      }

      if (text.includes("pixiv.net/novel/")) {
        await fetchPixivOrPaste();
        text = document.getElementById('inputText').value.trim();
      }

      const btn = document.getElementById('translateBtn');
      const contBtn = document.getElementById('continueBtn');
      const output = document.getElementById('outputArea');
      const statusLabel = document.getElementById('statusLabel');

      btn.disabled = true;
      contBtn.style.display = 'none';
      output.innerText = `[${activePresetName}] 룰북으로 번역하는 중...`;

      try {
        const cleanBaseUrl = baseUrl.replace(/\/+$/, '');
        const url = `${cleanBaseUrl}/chat/completions`;

        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: model,
            messages: [
              { role: 'system', content: prompt },
              { role: 'user', content: `다음 일본어 소설을 한국어로 번역하라:\n\n${text}` }
            ],
            max_tokens: 8192,
            temperature: 0.6
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTP ${res.status}`);
        }

        const data = await res.json();
        const choice = data.choices[0];
        output.innerText = choice.message.content.trim();

        if (choice.finish_reason === 'length') {
          contBtn.style.display = 'inline-block';
          statusLabel.innerText = "⚠️ 분량이 길어 중간에 잘림 (우측 [이어서 번역] 클릭)";
        } else {
          statusLabel.innerText = `번역 완료 (${activePresetName})`;
        }
      } catch (err) {
        output.innerText = `[번역 실패]: ${err.message}`;
        statusLabel.innerText = "오류 발생";
      } finally {
        btn.disabled = false;
      }
    }

    async function requestContinue() {
      const text = document.getElementById('inputText').value.trim();
      const currentOutput = document.getElementById('outputArea').innerText;
      const apiKey = localStorage.getItem('es_api_key');
      const baseUrl = localStorage.getItem('es_base_url') || 'https://api.deepseek.com';
      const model = localStorage.getItem('es_model') || 'deepseek-chat';
      const prompt = presets[activePresetName] || Object.values(presets)[0];

      const contBtn = document.getElementById('continueBtn');
      const statusLabel = document.getElementById('statusLabel');
      contBtn.disabled = true;
      statusLabel.innerText = "끊긴 뒷부분을 이어서 번역 중...";

      const lastContext = currentOutput.slice(-150);

      try {
        const cleanBaseUrl = baseUrl.replace(/\/+$/, '');
        const url = `${cleanBaseUrl}/chat/completions`;

        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: model,
            messages: [
              { role: 'system', content: prompt },
              { role: 'user', content: `다음 원문에서 아직 번역되지 않은 뒷부분을 이어서 번역하라.\n직전에 번역된 마지막 문장은 다음과 같다:\n"...${lastContext}"\n\n이 문장의 바로 뒤부터 자연스럽게 이어지도록 번역 본문만 출력하라:\n\n[전체 원문]:\n${text}` }
            ],
            max_tokens: 8192,
            temperature: 0.6
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTP ${res.status}`);
        }

        const data = await res.json();
        const choice = data.choices[0];
        document.getElementById('outputArea').innerText = currentOutput + "\n\n" + choice.message.content.trim();

        if (choice.finish_reason === 'length') {
          contBtn.style.display = 'inline-block';
          statusLabel.innerText = "⚠️ 여전히 분량이 남아있음 (한 번 더 [이어서 번역] 클릭)";
        } else {
          contBtn.style.display = 'none';
          statusLabel.innerText = `전체 이어 번역 완료 (${activePresetName})`;
        }
      } catch (err) {
        alert("이어 번역 실패: " + err.message);
        statusLabel.innerText = "이어 번역 실패";
      } finally {
        contBtn.disabled = false;
      }
    }
  </script>
