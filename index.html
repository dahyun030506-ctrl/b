<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>앙스타 팬픽 번역기</title>
  <style>
    :root {
      --bg: #121316;
      --card-bg: #1e2025;
      --border: #2e323b;
      --accent: #ff477e;
      --text: #e6e6e6;
      --text-sub: #9aa0a6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; padding: 16px; padding-bottom: 70px;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
      font-size: 15px; line-height: 1.6;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    h1 { font-size: 1.15rem; margin: 0; font-weight: 700; color: #fff; }
    .icon-btn {
      background: none; border: 1px solid var(--border); color: var(--text);
      padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; cursor: pointer;
    }
    .card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }
    textarea {
      width: 100%; height: 140px; background: transparent; border: none;
      color: var(--text); font-size: 0.95rem; line-height: 1.5; resize: vertical; outline: none;
    }
    .action-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      flex: 1; padding: 12px; border-radius: 8px; border: none;
      font-weight: 600; font-size: 0.95rem; cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn:disabled { opacity: 0.5; }
    #outputArea {
      min-height: 160px; white-space: pre-wrap; word-break: break-word;
      font-size: 1rem; line-height: 1.8;
    }
    /* 맨 위로 가기 플로팅 버튼 */
    .scroll-top-btn {
      position: fixed; bottom: 20px; right: 20px;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--accent); color: #ffffff;
      border: none; font-size: 1.2rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      cursor: pointer; z-index: 90;
      opacity: 0.9; transition: transform 0.2s, opacity 0.2s;
    }
    .scroll-top-btn:active {
      transform: scale(0.92);
      opacity: 1;
    }
    /* 설정 모달 */
    #settingsModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      padding: 20px; z-index: 100; overflow-y: auto;
    }
    .modal-content {
      background: var(--card-bg); border-radius: 14px; padding: 18px; max-width: 480px; margin: 40px auto;
      border: 1px solid var(--border);
    }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header id="top">
    <h1>★ Ensemble Translator</h1>
    <button class="icon-btn" onclick="openSettings()">⚙ 설정</button>
  </header>

  <!-- 본문/링크 입력 -->
  <div class="card">
    <textarea id="inputText" placeholder="일본어 원문 또는 Pixiv 링크를 붙여넣으세요."></textarea>
    <div class="action-row">
      <button class="btn btn-secondary" onclick="fetchPixivOrPaste()">픽시브 링크 추출</button>
      <button class="btn btn-primary" id="translateBtn" onclick="requestTranslate()">번역하기</button>
    </div>
  </div>

  <!-- 번역 결과 -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span style="font-size: 0.85rem; color: var(--text-sub);" id="statusLabel">번역 결과</span>
      <button class="icon-btn" onclick="copyResult()">복사</button>
    </div>
    <div id="outputArea">번역 결과가 여기에 표시됩니다.</div>
  </div>

  <!-- 맨 위로 가기 버튼 -->
  <button class="scroll-top-btn" onclick="scrollToTop()" title="맨 위로">▲</button>

  <!-- 설정 모달 -->
  <div id="settingsModal">
    <div class="modal-content">
      <h3 style="margin-top:0;">API & 치아미도 룰북 설정</h3>
      <div class="field">
        <label>엔진 선택</label>
        <select id="engineSelect" onchange="onEngineChange()">
          <option value="deepseek">DeepSeek (R-18 최적화 / 기본 권장)</option>
          <option value="openai">OpenAI (GPT-4o mini)</option>
          <option value="custom">직접 입력 (Custom Base URL)</option>
        </select>
      </div>
      <div class="field">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-...">
      </div>
      <div class="field">
        <label>Base URL</label>
        <input type="text" id="baseUrl" value="https://api.deepseek.com">
      </div>
      <div class="field">
        <label>Model 명</label>
        <input type="text" id="modelName" value="deepseek-chat">
      </div>
      <div class="field">
        <label>번역 프롬프트 (치아키 & 미도리 집중)</label>
        <textarea id="systemPrompt" style="height: 180px;"></textarea>
      </div>
      <div class="action-row">
        <button class="btn btn-primary" onclick="saveSettings()">저장 완료</button>
        <button class="btn btn-secondary" onclick="closeSettings()">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // 치아키 & 미도리 최적화 슬림 프롬프트
    const DEFAULT_PROMPT = `# Role
일본 서브컬처 팬픽 및 R-18 문학 전문 번역가. 
기계적 직역을 배제하고 단어 간 호응이 자연스러운 한국 웹소설 문체로 번역한다. (예: 덥수룩한 목소리 -> 잠긴/탁한 목소리 등 문맥에 맞는 자연스러운 표현으로 치환)

# Characters & Dynamic (앙상블 스타즈 - 유성대)
1. 모리사와 치아키 (守沢 千秋)
   - 1인칭: '오레(俺)' / 2인칭: '오마에(お前)' / 미도리 호칭: '타카미네(高峯)'
   - 말투: 열혈 히어로 톤, 직선적이고 당당한 반말, 큰 목소리와 넘치는 애정(! 다수). 
   - R-18: 저돌적이고 주도적이면서도 상대를 극진히 아끼고 다정하게 이끄는 톤.
2. 타카미네 미도리 (高峯 翠)
   - 1인칭: '보쿠(僕)' / 치아키 호칭: '모리사와 선배(守沢先輩)' 또는 '선배'
   - 말투: 힘없고 한숨 섞인 비관적 톤("우울해...", "죽고 싶어..."). 선배에게 기본적으로 존댓말(~거든요, ~라니까요 등 툴툴거리는 해요체)이지만 질색하면서도 은근히 마음을 주는 뉘앙스.
   - R-18: 버거워함, 수줍음, 붉어진 얼굴로 울먹거리거나 쾌감에 흔들리는 섬세한 호흡 묘사.

# Rules
- 호칭(~선배, ~상, ~군) 음차 유지.
- R-18 관능적 감각어, 신음, 체온, 피부 접촉은 검열 없이 농밀하게 번역.
- 해설이나 사족 없이 번역 본문만 출력.`;

    window.onload = () => {
      document.getElementById('apiKey').value = localStorage.getItem('es_api_key') || '';
      document.getElementById('baseUrl').value = localStorage.getItem('es_base_url') || 'https://api.deepseek.com';
      document.getElementById('modelName').value = localStorage.getItem('es_model') || 'deepseek-chat';
      document.getElementById('systemPrompt').value = localStorage.getItem('es_prompt') || DEFAULT_PROMPT;
      document.getElementById('engineSelect').value = localStorage.getItem('es_engine') || 'deepseek';
    };

    function onEngineChange() {
      const engine = document.getElementById('engineSelect').value;
      if (engine === 'deepseek') {
        document.getElementById('baseUrl').value = 'https://api.deepseek.com';
        document.getElementById('modelName').value = 'deepseek-chat';
      } else if (engine === 'openai') {
        document.getElementById('baseUrl').value = 'https://api.openai.com/v1';
        document.getElementById('modelName').value = 'gpt-4o-mini';
      }
    }

    function openSettings() { document.getElementById('settingsModal').style.display = 'block'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
    
    function saveSettings() {
      localStorage.setItem('es_api_key', document.getElementById('apiKey').value.trim());
      localStorage.setItem('es_base_url', document.getElementById('baseUrl').value.trim());
      localStorage.setItem('es_model', document.getElementById('modelName').value.trim());
      localStorage.setItem('es_prompt', document.getElementById('systemPrompt').value.trim());
      localStorage.setItem('es_engine', document.getElementById('engineSelect').value);
      closeSettings();
    }

    function copyResult() {
      const result = document.getElementById('outputArea').innerText;
      navigator.clipboard.writeText(result).then(() => alert("복사되었습니다."));
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function fetchPixivOrPaste() {
      let text = document.getElementById('inputText').value.trim();
      if (!text) {
        try {
          text = await navigator.clipboard.readText();
          document.getElementById('inputText').value = text;
        } catch(e) {}
      }

      const match = text.match(/(?:novel\/show\.php\?id=|\/novel\/)(\d+)/);
      if (!match) {
        alert("입력창에 올바른 Pixiv 소설 링크를 입력해주세요.");
        return;
      }

      const novelId = match[1];
      const statusLabel = document.getElementById('statusLabel');
      statusLabel.innerText = "픽시브 본문 다운로드 중...";

      try {
        const targetUrl = `https://www.pixiv.net/ajax/novel/${novelId}`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
        
        const res = await fetch(proxyUrl);
        const data = await res.json();

        if (data.error) {
          throw new Error("R-18 또는 비공개 작품입니다. 픽시브에서 본문을 직접 복사해 붙여넣어 주세요.");
        }

        let content = data.body?.content || "";
        content = content.replace(/\[newpage\]/g, "\n\n--- [페이지 구분] ---\n\n")
                         .replace(/\[\[rb:(.*?)>(.*?)\]\]/g, "$1($2)")
                         .replace(/\[chapter:(.*?)\]/g, "\n[챕터: $1]\n");

        document.getElementById('inputText').value = content;
        statusLabel.innerText = `본문 추출 완료 (${data.body.title || '무제'})`;
        alert("본문을 성공적으로 가져왔습니다.");
      } catch (err) {
        alert(err.message);
        statusLabel.innerText = "본문 추출 실패";
      }
    }

    async function requestTranslate() {
      let text = document.getElementById('inputText').value.trim();
      const apiKey = localStorage.getItem('es_api_key');
      const baseUrl = localStorage.getItem('es_base_url') || 'https://api.deepseek.com';
      const model = localStorage.getItem('es_model') || 'deepseek-chat';
      const prompt = localStorage.getItem('es_prompt') || DEFAULT_PROMPT;

      if (!apiKey) {
        alert("우측 상단 ⚙ 설정에서 API Key를 먼저 입력해주세요.");
        openSettings();
        return;
      }
      if (!text) {
        alert("번역할 텍스트를 입력해주세요.");
        return;
      }

      if (text.includes("pixiv.net/novel/")) {
        await fetchPixivOrPaste();
        text = document.getElementById('inputText').value.trim();
      }

      const btn = document.getElementById('translateBtn');
      const output = document.getElementById('outputArea');
      btn.disabled = true;
      output.innerText = "치아키 & 미도리 룰북을 반영하여 번역하는 중...";

      try {
        const cleanBaseUrl = baseUrl.replace(/\/+$/, '');
        const url = `${cleanBaseUrl}/chat/completions`;

        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: model,
            messages: [
              { role: 'system', content: prompt },
              { role: 'user', content: `다음 일본어 텍스트를 번역하라:\n\n${text}` }
            ],
            temperature: 0.6
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTP ${res.status}`);
        }

        const data = await res.json();
        output.innerText = data.choices[0].message.content.trim();
      } catch (err) {
        output.innerText = `[번역 실패]: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
